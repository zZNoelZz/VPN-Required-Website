<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Noeru Crypto Inc | Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c47ff;
            --primary-dark: #5333c5;
            --bg: #f5f6fa;
            --card-bg: #fff;
            --border: #e3e3ed;
            --input-bg: #f7f7fc;
            --input-focus: #e5e8ff;
            --shadow: 0 8px 32px 0 rgba(44, 44, 84, 0.12);
        }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .company-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            justify-content: center;
        }
        .logo-svg {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6c47ff 45%, #20e3b2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-svg svg {
            width: 32px;
            height: 32px;
            color: #fff;
        }
        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: var(--primary-dark);
            letter-spacing: 1px;
        }
        .login-card {
            background: var(--card-bg);
            padding: 32px 36px 24px 36px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            border: 1px solid var(--border);
            position: relative;
        }
        .login-card h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-align: center;
            margin-bottom: 14px;
            color: #222;
            font-size: 1.25rem;
        }
        .login-card .desc {
            text-align: center;
            color: #888bb0;
            font-size: 0.99rem;
            margin-bottom: 18px;
        }
        .login-card label {
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 4px;
            color: #3a3a5a;
            font-size: 0.98rem;
        }
        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 11px 12px;
            border-radius: 7px;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            font-size: 1rem;
            margin-bottom: 8px;
            transition: border-color 0.2s, background 0.2s;
            outline: none;
        }
        .login-card input[type="text"]:focus,
        .login-card input[type="password"]:focus {
            border-color: var(--primary);
            background: var(--input-focus);
        }
        .login-card button[type="submit"] {
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            border: none;
            border-radius: 7px;
            background: linear-gradient(90deg, var(--primary) 60%, #20e3b2 100%);
            color: #fff;
            font-size: 1.08rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px 0 rgba(108, 71, 255, 0.08);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .login-card button[type="submit"]:hover {
            background: linear-gradient(90deg, var(--primary-dark) 60%, #14b989 100%);
            box-shadow: 0 6px 14px 0 rgba(108, 71, 255, 0.13);
        }
        .error-message {
            color: #e33a4c;
            border-radius: 6px;
            margin-top: 12px;
            padding: 7px 0;
            text-align: center;
            font-size: 0.97rem;
            min-height: 24px;
        }
        .error-message:not(:empty) {
            background: #fff5f6;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin-top: 0; font-family: 'Montserrat'; }
        .modal-content input {
            width: 100%;
            font-size: 24px;
            text-align: center;
            letter-spacing: 5px;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin: 15px 0;
            outline: none;
            box-sizing: border-box;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer {
            margin-top: 32px;
            text-align: center;
            color: #a0a4c3;
            font-size: 0.97rem;
        }
    </style>
</head>
<body>

<div class="company-logo">
    <div class="logo-svg">
        <svg viewBox="0 0 32 32" fill="none">
            <path d="M7 25V7h3.5l11 18H25V7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    <span class="company-name">Noeru Crypto Inc</span>
</div>

<form class="login-card" id="login-form" autocomplete="off">
    <h2>Đăng nhập hệ thống</h2>
    <div class="desc">Chào mừng đến với cổng nhân sự của Noeru Crypto Inc.</div>
    <label for="username">Tên đăng nhập</label>
    <input type="text" id="username" placeholder="Nhập tên đăng nhập..." required autofocus>
    <label for="password">Mật khẩu</label>
    <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
    <button type="submit">Đăng nhập</button>
    <div class="error-message" id="error-message"></div>
</form>

<div class="modal-overlay" id="2fa-modal">
    <div class="modal-content">
        <h3>Xác thực 2 lớp</h3>
        <div id="qr-container" style="display:none;">
            <p style="font-size: 0.8rem; color: #666;">Quét mã bằng app Authenticator</p>
            <img id="qr-image" style="width:160px; margin: 10px auto; display: block;">
        </div>
        <p>Nhập mã PIN 6 số:</p>
        <input type="text" id="2fa-pin" maxlength="6" placeholder="000000">
        <button id="verify-2fa-btn">XÁC NHẬN</button>
        <p style="margin-top:15px; font-size:0.8rem; color:gray; cursor:pointer;" onclick="location.reload()">Quay lại</p>
    </div>
</div>

<div class="footer">&copy; 2026 Noeru Crypto Inc. All rights reserved.</div>

<script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-message');
    const modal = document.getElementById('2fa-modal');
    const pinInput = document.getElementById('2fa-pin');

    let tempUser = {};

    form.addEventListener('submit', async e => {
        e.preventDefault();
        errorMsg.textContent = '';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });

            if (res.ok) {
                const data = await res.json();
                tempUser = { username, password, name: data.name, role: data.role };
                modal.style.display = 'flex';
                pinInput.focus();

                if (data.mustVerify2FA && !data.hasSecret) {
                    const qrRes = await fetch('/api/setup-2fa', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username})
                    });
                    const qrData = await qrRes.json();
                    document.getElementById('qr-image').src = qrData.qrCode;
                    document.getElementById('qr-container').style.display = 'block';
                } else {
                    document.getElementById('qr-container').style.display = 'none';
                }
            } else {
                errorMsg.textContent = 'Sai tài khoản hoặc mật khẩu';
            }
        } catch {
            errorMsg.textContent = 'Lỗi kết nối máy chủ';
        }
    });

    const verifyPin = async () => {
        const pin = pinInput.value;
        try {
            const res = await fetch('/api/verify-2fa', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: tempUser.username, token: pin })
            });

            if (res.ok) {
                const data = await res.json();
                sessionStorage.setItem('user_name', data.name);
                sessionStorage.setItem('user_username', tempUser.username);
                sessionStorage.setItem('user_role', data.role);
                sessionStorage.setItem('user_password', tempUser.password);
                location.href = 'dashboard.html';
            } else {
                alert('Mã PIN không chính xác');
                pinInput.value = '';
                pinInput.focus();
            }
        } catch {
            alert('Lỗi xác thực');
        }
    };

    document.getElementById('verify-2fa-btn').onclick = verifyPin;

    pinInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') verifyPin();
    });
</script>
</body>
</html>
