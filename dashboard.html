<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Noeru Crypto Inc | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --danger: #dc3545;
            --danger-dark: #b52a37;
            --success: #13c26b;
            --success-dark: #0d9d56;
            --bg: #f4f6f8;
            --card-bg: #fff;
            --shadow: 0 8px 32px rgba(0,0,0,0.10);
            --radius: 16px;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .dashboard-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 420px;
            width: 100%;
            margin-top: 48px;
            padding: 38px 32px 30px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.7s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px);}
            to { opacity: 1; transform: none;}
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }
        .logo svg {
            width: 38px;
            height: 38px;
            display: block;
        }
        .company-name {
            font-size: 1.35rem;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 1.2px;
        }
        .greeting {
            font-size: 1.08rem;
            margin-bottom: 20px;
            color: #222;
            width: 100%;
            text-align: center;
        }
        .token-prices {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }
        .token {
            background: #f1f8fe;
            border-radius: 8px;
            padding: 7px 13px;
            font-size: 0.97rem;
            color: #222;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .token .symbol {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.05em;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 28px;
        }
        .actions button {
            width: 100%;
            padding: 12px 0;
            font-size: 1rem;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.18s, transform 0.08s;
            font-weight: 500;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 8px rgba(0,123,255,0.04);
        }
        .actions button:active {
            transform: scale(0.97);
        }
        .signout-btn {
            background: var(--danger);
            color: #fff;
        }
        .signout-btn:hover { background: var(--danger-dark);}
        .download-btn {
            background: var(--primary);
            color: #fff;
        }
        .download-btn:hover { background: var(--primary-dark);}
        .vpn-btn {
            background: var(--success);
            color: #fff;
        }
        .vpn-btn:hover { background: var(--success-dark);}
        .instructions {
            background: #f8f9fa;
            border-radius: 9px;
            padding: 17px 16px 14px 16px;
            font-size: 0.98rem;
            color: #333;
            margin-bottom: 8px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 1px 6px rgba(0,0,0,0.03);
        }
        .instructions b {
            color: var(--primary);
        }
        .contact {
            color: #666;
            font-size: 0.98rem;
            margin-top: 8px;
            text-align: center;
            width: 100%;
        }
        @media (max-width: 600px) {
            .dashboard-card {
                padding: 18px 4vw 18px 4vw;
                margin-top: 16vw;
                max-width: 98vw;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-card">
    <div class="logo">
        <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" stroke="#007bff" stroke-width="2" fill="#e6f1ff"/>
            <path d="M13 25c2.5-3 11.5-3 14 0" stroke="#007bff" stroke-width="2" stroke-linecap="round"/>
            <circle cx="15.5" cy="17" r="2" fill="#007bff"/>
            <circle cx="24.5" cy="17" r="2" fill="#007bff"/>
        </svg>
        <span class="company-name">Noeru Crypto Inc</span>
    </div>
    <div id="greeting" class="greeting"></div>
    <div id="token-prices" class="token-prices"></div>
    <div class="actions">
        <button class="signout-btn" onclick="signOut()">Đăng xuất</button>
        <button class="download-btn" onclick="downloadConfig()">Tải về config</button>
        <button class="vpn-btn" onclick="gotoMain()">Đã cập nhật config, kết nối VPN</button>
    </div>
    <div class="instructions">
        <b>Hướng dẫn sử dụng VPN:</b><br>
        1. Tải config về máy<br>
        2. Mở ứng dụng <b>WireGuard</b> đã cài sẵn<br>
        3. Import và chạy config vừa tải<br>
        4. Ấn nút <b>Đã cập nhật config, kết nối VPN</b> để chuyển hướng<br>
        <span style="color: #13c26b;">Chúc bạn một ngày làm việc năng suất!</span>
    </div>
    <div class="contact">
        Nếu có vấn đề vui lòng liên hệ bạn <b>Ken</b> ở phòng kỹ thuật
    </div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.get('name')) localStorage.setItem('user_name', urlParams.get('name'));
    if (urlParams.get('username')) localStorage.setItem('user_username', urlParams.get('username'));
    if (urlParams.get('role')) localStorage.setItem('user_role', urlParams.get('role'));
    if (urlParams.get('password')) localStorage.setItem('user_password', urlParams.get('password'));

    if (window.location.search) {
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
    }

    const displayName = localStorage.getItem('user_name') || 'User';
    const displayRole = localStorage.getItem('user_role') || 'employee';

    document.getElementById('greeting').innerText = `Chào mừng, ${displayName}! (${displayRole.toUpperCase()})`;

    function signOut() {
        localStorage.clear();
        location.href = 'login.html';
    }

    window.addEventListener('DOMContentLoaded', () => {
        const lastDownloaded = localStorage.getItem('last_download_time');
        if (lastDownloaded) {
            console.log("Lần cuối tải key là: " + lastDownloaded);
        }
    });

    function downloadConfig() {
        const name = localStorage.getItem('user_name');
        const user = localStorage.getItem('user_username') || name;

        if (!user || user === 'User') {
            alert("Không tìm thấy thông tin!");
            return;
        }

        const fileName = `wg_${user}.conf`;

        const downloadUrl = `/keys/${encodeURIComponent(fileName)}?t=${new Date().getTime()}`;

        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        localStorage.setItem('last_download_time', new Date().toLocaleString());
    }

    function gotoMain() {
        const name = localStorage.getItem('user_name');
        const user = localStorage.getItem('user_username') || name;
        const pass = localStorage.getItem('user_password') || '';
        const role = localStorage.getItem('user_role') || 'employee';

        if (!name && !user) {
            alert("Phiên làm việc đã hết hạn!");
            location.href = 'login.html';
            return;
        }

        location.href = `mainPage.html?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&role=${encodeURIComponent(role)}`;
    }

    async function fetchTokenPrices() {
        try {
            const ids = ['bitcoin','ethereum','binancecoin','solana','cardano'];
            const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=usd`;
            const res = await fetch(url), data = await res.json();
            const tokens = [
                {symbol: 'BTC', price: data.bitcoin.usd},
                {symbol: 'ETH', price: data.ethereum.usd},
                {symbol: 'BNB', price: data.binancecoin.usd},
                {symbol: 'SOL', price: data.solana.usd},
                {symbol: 'ADA', price: data.cardano.usd}
            ];
            document.getElementById('token-prices').innerHTML = tokens.map(t =>
                `<div class="token"><span class="symbol">${t.symbol}</span> $${t.price.toLocaleString()}</div>`
            ).join('');
        } catch {
            document.getElementById('token-prices').innerHTML = '<span style="color:#e33a4c;">Không tải được giá token</span>';
        }
    }
    fetchTokenPrices();
</script>
</body>
</html>
